<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Applications | Smart Service Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar-custom {
            background: #0b3d6e;
        }

        .page-header {
            margin-top: 35px;
            margin-bottom: 25px;
        }

        .applications-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark navbar-custom">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/dashboard/"
        >
            Smart Service Portal
        </a>


        <button
            class="btn btn-light btn-sm"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <div class="page-header">

        <h2 class="fw-bold">
            My Applications
        </h2>

        <p class="text-muted">
            View and track your submitted service applications.
        </p>

    </div>


    <div class="card applications-card">

        <div class="card-body p-4">


            <div class="d-flex justify-content-between align-items-center mb-4">

                <h5 class="fw-bold mb-0">
                    Applications
                </h5>


                <a
                    href="/apply/"
                    class="btn btn-primary"
                >
                    + New Application
                </a>

            </div>


            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>Application No.</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="applications">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center py-5"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

async function loadApplications() {

    const token =
        localStorage.getItem("access");


    if (!token) {

        window.location.href = "/";

        return;
    }


    try {

        const response = await fetch(
            "/api/applications/",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            window.location.href = "/";

            return;
        }


        const applications =
            data.results || data;


        const tbody =
            document.getElementById("applications");


        if (!applications.length) {

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="text-center py-5 text-muted"
                    >
                        No applications found.
                    </td>
                </tr>
            `;

            return;
        }


        let html = "";


        applications.forEach(function(app) {

            let badge = "bg-secondary";


            if (app.status === "SUBMITTED") {
                badge = "bg-info text-dark";
            }

            if (app.status === "UNDER_REVIEW") {
                badge = "bg-warning text-dark";
            }

            if (app.status === "DOCUMENT_VERIFIED") {
                badge = "bg-primary";
            }

            if (app.status === "APPROVED") {
                badge = "bg-success";
            }

            if (app.status === "REJECTED") {
                badge = "bg-danger";
            }


            const date =
                app.created_at
                    ? new Date(app.created_at)
                        .toLocaleDateString()
                    : "-";


            html += `

                <tr>

                    <td class="fw-semibold">
                        ${app.application_number || "-"}
                    </td>

                    <td>
                        ${app.service_type || "-"}
                    </td>

                    <td>
                        <span class="badge ${badge}">
                            ${app.status || "-"}
                        </span>
                    </td>

                    <td>
                        ${date}
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-outline-primary"
                            onclick="viewApplication(${app.id})"
                        >
                            View
                        </button>

                    </td>

                </tr>

            `;

        });


        tbody.innerHTML = html;


    } catch (error) {

        console.error(error);

        document.getElementById(
            "applications"
        ).innerHTML = `
            <tr>
                <td
                    colspan="5"
                    class="text-center text-danger py-5"
                >
                    Unable to load applications.
                </td>
            </tr>
        `;

    }

}


function viewApplication(id) {

    window.location.href =
        "/application/?id=" + id;

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}


loadApplications();

</script>

</body>
</html>
