<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Smart Service Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .brand {
            color: #0b3d6e;
            font-weight: 700;
        }

        .btn-login {
            background: #0b3d6e;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 11px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #092f55;
            color: white;
        }

    </style>

</head>


<body>

<div class="card login-card">

    <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">

            <h3 class="brand">
                Smart Service Portal
            </h3>

            <p class="text-muted mb-0">
                Login to continue
            </p>

        </div>


        <div id="message"></div>


        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-login w-100"
            >
                Login
            </button>

        </form>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        message.innerHTML = "";


        try {

            const response = await fetch(
                "/api/auth/login/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data =
                await response.json();


            if (!response.ok) {

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Invalid email or password.
                    </div>
                `;

                return;
            }


            localStorage.setItem(
                "access",
                data.access
            );

            localStorage.setItem(
                "refresh",
                data.refresh
            );

            localStorage.setItem(
                "role",
                data.role
            );

            localStorage.setItem(
                "name",
                data.name || ""
            );


            if (data.role === "OFFICER") {

                window.location.href =
                    "/officer/";

            } else {

                window.location.href =
                    "/dashboard/";

            }

        } catch (error) {

            console.error(error);

            message.innerHTML = `
                <div class="alert alert-danger">
                    Unable to connect to server.
                </div>
            `;
        }

    });

</script>

</body>
</html>
