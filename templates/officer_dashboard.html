<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Officer Dashboard | Smart Service Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar-custom {
            background: #0b3d6e;
        }

        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .page-header {
            margin-top: 35px;
            margin-bottom: 25px;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark navbar-custom">

    <div class="container">

        <span class="navbar-brand fw-bold">
            Smart Service Portal - Officer
        </span>


        <button
            class="btn btn-light btn-sm"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <div class="page-header">

        <h2 class="fw-bold">
            Officer Dashboard
        </h2>

        <p class="text-muted">
            Review and process service applications.
        </p>

    </div>


    <div class="card card-custom">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>

                            <th>Application</th>
                            <th>Applicant</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="applications">

                        <tr>

                            <td
                                colspan="5"
                                class="text-center py-5"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

async function loadApplications() {

    const token =
        localStorage.getItem("access");

    const role =
        localStorage.getItem("role");


    if (!token || role !== "OFFICER") {

        window.location.href = "/";

        return;
    }


    try {

        const response = await fetch(
            "/api/applications/officer/",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            document.getElementById(
                "applications"
            ).innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="text-center text-danger py-5"
                    >
                        Unable to load applications.
                    </td>
                </tr>
            `;

            return;
        }


        const applications =
            data.results || data;


        if (!applications.length) {

            document.getElementById(
                "applications"
            ).innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="text-center text-muted py-5"
                    >
                        No applications available.
                    </td>
                </tr>
            `;

            return;
        }


        let html = "";


        applications.forEach(function(app) {

            let badge = "bg-secondary";


            if (app.status === "SUBMITTED") {
                badge = "bg-info text-dark";
            }

            if (app.status === "UNDER_REVIEW") {
                badge = "bg-warning text-dark";
            }

            if (app.status === "DOCUMENT_VERIFIED") {
                badge = "bg-primary";
            }

            if (app.status === "APPROVED") {
                badge = "bg-success";
            }

            if (app.status === "REJECTED") {
                badge = "bg-danger";
            }


            html += `

                <tr>

                    <td class="fw-semibold">
                        ${app.application_number || "-"}
                    </td>

                    <td>
                        ${app.user || "-"}
                    </td>

                    <td>
                        ${app.service_type || "-"}
                    </td>

                    <td>
                        <span class="badge ${badge}">
                            ${app.status || "-"}
                        </span>
                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-primary"
                            onclick="reviewApplication(${app.id})"
                        >
                            Review
                        </button>

                    </td>

                </tr>

            `;

        });


        document.getElementById(
            "applications"
        ).innerHTML = html;


    } catch (error) {

        console.error(error);

    }

}


function reviewApplication(id) {

    window.location.href =
        "/officer/review/?id=" + id;

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}


loadApplications();

</script>

</body>
</html>
