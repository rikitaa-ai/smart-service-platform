<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Review Application | Smart Service Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar-custom {
            background: #0b3d6e;
        }

        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .page-header {
            margin-top: 35px;
            margin-bottom: 25px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark navbar-custom">

    <div class="container">

        <span class="navbar-brand fw-bold">
            Smart Service Portal - Officer
        </span>


        <button
            class="btn btn-light btn-sm"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <div class="page-header">

        <h2 class="fw-bold">
            Review Application
        </h2>

        <p class="text-muted">
            Verify documents and process the application.
        </p>

    </div>


    <div id="content">

        <div class="text-center py-5">
            Loading...
        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("access");


const params =
    new URLSearchParams(
        window.location.search
    );


const id =
    params.get("id");


async function loadApplication() {

    if (
        !token ||
        localStorage.getItem("role") !== "OFFICER" ||
        !id
    ) {

        window.location.href = "/";

        return;
    }


    try {

        const response = await fetch(
            "/api/applications/officer/" + id + "/",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            document.getElementById(
                "content"
            ).innerHTML = `
                <div class="alert alert-danger">
                    Unable to load application.
                </div>
            `;

            return;
        }


        const app =
            data.application;

        const documents =
            data.documents;


        let badge = "bg-secondary";


        if (app.status === "SUBMITTED") {
            badge = "bg-info text-dark";
        }

        if (app.status === "UNDER_REVIEW") {
            badge = "bg-warning text-dark";
        }

        if (app.status === "DOCUMENT_VERIFIED") {
            badge = "bg-primary";
        }

        if (app.status === "APPROVED") {
            badge = "bg-success";
        }

        if (app.status === "REJECTED") {
            badge = "bg-danger";
        }


        let documentsHtml = "";


        if (!documents.length) {

            documentsHtml = `
                <div class="alert alert-warning">
                    No documents uploaded.
                </div>
            `;

        } else {

            documents.forEach(function(doc) {

                documentsHtml += `

                    <div
                        class="border rounded p-3 mb-2
                               d-flex justify-content-between
                               align-items-center"
                    >

                        <div>

                            <strong>
                                ${doc.document_type || "-"}
                            </strong>

                            <div class="small text-muted">
                                ${doc.document_file || "-"}
                            </div>

                        </div>


                        <div>

                            ${
                                doc.is_verified
                                ?
                                `
                                    <span class="badge bg-success">
                                        Verified
                                    </span>
                                `
                                :
                                `
                                    <button
                                        class="btn btn-sm btn-outline-primary"
                                        onclick="verifyDocument(
                                            ${app.id},
                                            ${doc.id}
                                        )"
                                    >
                                        Verify
                                    </button>
                                `
                            }

                        </div>

                    </div>

                `;

            });

        }


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="card card-custom mb-4">

                <div class="card-body p-4">

                    <div class="d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <div class="detail-label">
                                Application Number
                            </div>

                            <h4 class="fw-bold">
                                ${app.application_number}
                            </h4>

                        </div>


                        <span class="badge ${badge}">
                            ${app.status}
                        </span>

                    </div>


                    <hr>


                    <div class="row g-4">

                        <div class="col-md-6">

                            <div class="detail-label">
                                Service
                            </div>

                            <div class="detail-value">
                                ${app.service_type}
                            </div>

                        </div>


                        <div class="col-12">

                            <div class="detail-label">
                                Description
                            </div>

                            <div class="detail-value">
                                ${app.description}
                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <div class="card card-custom mb-4">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-3">
                        Documents
                    </h5>

                    ${documentsHtml}

                </div>

            </div>


            <div class="card card-custom">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-3">
                        Application Actions
                    </h5>


                    <div class="d-flex flex-wrap gap-2">

                        ${
                            app.status === "SUBMITTED"
                            ?
                            `
                                <button
                                    class="btn btn-warning"
                                    onclick="startReview()"
                                >
                                    Start Review
                                </button>
                            `
                            :
                            ""
                        }


                        ${
                            app.status === "DOCUMENT_VERIFIED"
                            ?
                            `
                                <button
                                    class="btn btn-success"
                                    onclick="approveApplication()"
                                >
                                    Approve Application
                                </button>
                            `
                            :
                            ""
                        }


                        ${
                            app.status !== "APPROVED" &&
                            app.status !== "REJECTED"
                            ?
                            `
                                <button
                                    class="btn btn-danger"
                                    onclick="rejectApplication()"
                                >
                                    Reject Application
                                </button>
                            `
                            :
                            ""
                        }

                    </div>


                    <div
                        id="message"
                        class="mt-3"
                    ></div>

                </div>

            </div>

        `;

    } catch (error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML = `
            <div class="alert alert-danger">
                Server connection error.
            </div>
        `;

    }

}


async function postAction(url) {

    const response =
        await fetch(
            url,
            {
                method: "POST",

                headers: {
                    "Authorization":
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"
                }
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error || "Action failed."
        );

    }


    return data;

}


async function startReview() {

    try {

        await postAction(
            `/api/applications/${id}/review/`
        );

        await loadApplication();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


async function verifyDocument(
    applicationId,
    documentId
) {

    try {

        await postAction(
            `/api/applications/${applicationId}/documents/${documentId}/verify/`
        );

        await loadApplication();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


async function approveApplication() {

    try {

        await postAction(
            `/api/applications/${id}/approve/`
        );

        await loadApplication();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


async function rejectApplication() {

    const confirmed =
        confirm(
            "Are you sure you want to reject this application?"
        );


    if (!confirmed) {
        return;
    }


    try {

        await postAction(
            `/api/applications/${id}/reject/`
        );

        await loadApplication();

    } catch (error) {

        showMessage(
            error.message,
            "danger"
        );

    }

}


function showMessage(
    message,
    type
) {

    document.getElementById(
        "message"
    ).innerHTML = `

        <div class="alert alert-${type}">
            ${message}
        </div>

    `;

}


function logout() {

    localStorage.clear();

    window.location.href = "/";

}


loadApplication();

</script>

</body>
</html>
